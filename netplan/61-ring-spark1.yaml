# /etc/netplan/61-ring.yaml on spark1 (rank 0). Cable ports only; keep your management/Wi-Fi config as it is.
# Each 200G port shows up as two netdevs (enp1s0f* and enP2p1s0f*); each netdev gets its own /24.
network:
  version: 2
  ethernets:
    enp1s0f0np0:   {addresses: [192.168.100.11/24], mtu: 9000}   # port 0 -> spark2
    enP2p1s0f0np0: {addresses: [192.168.101.11/24], mtu: 9000}   # port 0 -> spark2
    enp1s0f1np1:   {addresses: [192.168.106.11/24], mtu: 9000}   # port 1 -> spark4
    enP2p1s0f1np1: {addresses: [192.168.107.11/24], mtu: 9000}   # port 1 -> spark4
